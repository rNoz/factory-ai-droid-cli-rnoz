name: Check Upstream, Patch & Build Factory CLI

'on':
  schedule:
    # Check every four hours; unchanged scheduled runs stop before setup.
    - cron: '0 */4 * * *'
  push:
    branches: [ main ]
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild even if version has not changed'
        required: false
        default: false
        type: boolean
      package_revision:
        description: 'Override package revision for a maintainer-run metadata repair'
        required: false
        default: ''
        type: string
      upstream_version:
        description: 'Override upstream Droid version for an owner-run reproducible rebuild'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('factory-cli-pr-{0}', github.event.pull_request.number) || 'factory-cli-release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.check_version.outputs.should_build }}
      run_ci: ${{ steps.check_version.outputs.run_ci }}
      upstream_version: ${{ steps.check_version.outputs.upstream_version }}
      package_revision: ${{ steps.check_version.outputs.package_revision }}
      upstream_validation_failed: ${{ steps.validate_upstream.outcome == 'failure' }}
    steps:
      - name: Verify authorized maintainer dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.actor }}" != "${{ github.repository_owner }}" ]; then
            echo "::error::Unauthorized manual trigger by ${{ github.actor }}. Only ${{ github.repository_owner }} may trigger this workflow manually."
            exit 1
          fi
          echo "Manual trigger authorized for maintainer: ${{ github.actor }}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect and validate upstream Factory CLI version
        id: check_version
        run: |
          if [ -n "${{ inputs.upstream_version }}" ]; then
            UPSTREAM_RAW=$(python3 scripts/check-upstream-version.py --override "${{ inputs.upstream_version }}")
          else
            UPSTREAM_RAW=$(python3 scripts/check-upstream-version.py)
          fi

          TARGET_VERSION="$UPSTREAM_RAW"
          CURRENT_VER=$(grep -oP '^pkgver=\K.*' PKGBUILD)
          CURRENT_REL=$(grep -oP '^pkgrel=\K.*' PKGBUILD)
          echo "upstream_version=$TARGET_VERSION" >> $GITHUB_OUTPUT
          echo "current_version=$CURRENT_VER" >> $GITHUB_OUTPUT
          echo "Official upstream version: $UPSTREAM_RAW"
          echo "Target package version: $TARGET_VERSION"
          echo "Current package version: $CURRENT_VER-$CURRENT_REL"

          PACKAGE_CHANGE=false
          if [ "${{ github.event_name }}" = "push" ] &&
             [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            COMMIT_SUBJECT=$(git log -1 --format=%s)
            if [[ ! "$COMMIT_SUBJECT" =~ ^chore\(release\):[[:space:]]prepare[[:space:]]v ]]; then
              if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" |
                 grep -Eq '^(PKGBUILD|\.SRCINFO$|patches/|patch_(title|keybindings)\.py$|factory-ai-droid-cli-rnoz-bin\.install$)'; then
                PACKAGE_CHANGE=true
              fi
            fi
          fi
          echo "package_change=$PACKAGE_CHANGE" >> $GITHUB_OUTPUT

          REQUESTED_REL="${{ inputs.package_revision }}"
          if [ -n "$REQUESTED_REL" ] && ! [[ "$REQUESTED_REL" =~ ^[1-9][0-9]*$ ]]; then
            echo "Error: package_revision must be a positive integer." >&2
            exit 1
          fi
          if [ -n "$REQUESTED_REL" ]; then
            PACKAGE_REVISION=$REQUESTED_REL
          elif [ "$TARGET_VERSION" != "$CURRENT_VER" ]; then
            PACKAGE_REVISION=1
          elif [ "$PACKAGE_CHANGE" = "true" ] || [ "${{ inputs.force_build }}" = "true" ]; then
            PACKAGE_REVISION=$((CURRENT_REL + 1))
          else
            PACKAGE_REVISION=$CURRENT_REL
          fi
          echo "package_revision=$PACKAGE_REVISION" >> $GITHUB_OUTPUT

          RUN_CI=true
          if [ "${{ github.event_name }}" = "schedule" ] &&
             [ "$TARGET_VERSION" = "$CURRENT_VER" ] &&
             [ "${{ inputs.force_build }}" != "true" ] &&
             [ -z "$REQUESTED_REL" ]; then
            RUN_CI=false
            echo "Scheduled run found no upstream change; skipping validation and build."
          fi
          echo "run_ci=$RUN_CI" >> $GITHUB_OUTPUT

          if [ "$TARGET_VERSION" != "$CURRENT_VER" ] || [ "${{ inputs.force_build }}" = "true" ] ||
             [ "${{ github.event_name }}" = "pull_request" ] || [ "$PACKAGE_CHANGE" = "true" ] ||
             [ -n "$REQUESTED_REL" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "Version is up to date ($CURRENT_VER). No build needed."
          fi

      - name: Set up Python
        if: steps.check_version.outputs.run_ci == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install Python & Shell Linters
        if: steps.check_version.outputs.run_ci == 'true'
        run: |
          pip install flake8
          sudo apt-get update -qq && sudo apt-get install -qq -y shellcheck shfmt

      - name: Run static linters and format checks
        if: steps.check_version.outputs.run_ci == 'true'
        run: |
          echo "==> Validating Python syntax & bytecode..."
          python3 -m py_compile patches/*.py scripts/*.py tests/*.py
          echo "==> Running flake8 Python linter..."
          flake8 --max-line-length=120 --extend-ignore=E203 patches/ scripts/ tests/
          echo "==> Running shellcheck on shell scripts & PKGBUILD..."
          shellcheck scripts/patch-macos.sh scripts/build-local.sh scripts/build-in-container.sh
          shellcheck -s bash factory-ai-droid-cli-rnoz-bin.install
          shellcheck -s bash -e SC2034,SC2154,SC2164 PKGBUILD
          echo "==> Verifying shell script formatting with shfmt..."
          shfmt -i 2 -ci -d scripts/ factory-ai-droid-cli-rnoz-bin.install

      - name: Run security audit via aurscan
        if: steps.check_version.outputs.run_ci == 'true'
        run: |
          echo "==> Fetching pinned aurscan v0.9.1 security scanner..."
          sudo curl -fsSL https://github.com/manticore-projects/aurscan/releases/download/v0.9.1/aurscan-linux-amd64 -o /usr/local/bin/aurscan
          echo "2edb094a0cc69a2bc20bc6a9e3d4c16969306e09507be112de285a0ac68d5b70  /usr/local/bin/aurscan" | sha256sum -c
          sudo chmod +x /usr/local/bin/aurscan
          echo "==> Running static rule security audit on repository..."
          aurscan --rules-only .

      - name: Run offline synthetic fixtures & breakage simulations
        if: steps.check_version.outputs.run_ci == 'true'
        run: |
          echo "==> Running offline synthetic patcher fixtures..."
          python3 tests/test_versions.py --offline
          echo "==> Running keybinding rotation fixture tests..."
          python3 tests/test_keybindings.py
          echo "==> Running breakage & recovery simulation suite..."
          python3 tests/simulate_breakage.py
          echo "==> Running release metadata regression tests..."
          python3 tests/test_release_metadata.py

      - name: Run multi-version patcher validation
        id: validate_upstream
        if: steps.check_version.outputs.should_build == 'true'
        run: |
          python3 tests/test_versions.py --latest

      - name: Build and smoke test package in Arch Linux container
        if: steps.check_version.outputs.should_build == 'true'
        run: |
          chmod +x scripts/build-in-container.sh
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/github/workspace \
            archlinux@sha256:61f7de2dd88cc4ba1fe36c24cfe1a503c3936984492d6405eeab013ce6ac68c5 \
            /github/workspace/scripts/build-in-container.sh "${{ steps.check_version.outputs.upstream_version }}" "${{ steps.check_version.outputs.package_revision }}"

      - name: Upload packaging metadata
        if: steps.check_version.outputs.should_build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-metadata-${{ steps.check_version.outputs.upstream_version }}
          include-hidden-files: true
          path: |
            PKGBUILD
            .SRCINFO

  report-upstream-breakage:
    name: report-upstream-breakage
    needs: build-and-test
    if: >
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.build-and-test.result == 'failure' &&
      needs.build-and-test.outputs.upstream_validation_failed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Report upstream compatibility validation failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_VER: ${{ needs.build-and-test.outputs.upstream_version }}
        run: |
          set -euo pipefail
          echo "==> Upstream compatibility validation failed. Triggering breakage alert..."

          if ! gh label list --repo "$GITHUB_REPOSITORY" --limit 100 --json name --jq '.[].name' |
            grep -Fxq "upstream-breakage"; then
            echo "::error::Required GitHub label 'upstream-breakage' is missing." >&2
            exit 1
          fi

          if ! EXISTING_ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --label "upstream-breakage" --state open --json number --jq '.[0].number // empty'); then
            echo "::error::Unable to query open upstream-breakage issues." >&2
            exit 1
          fi

          if [ -z "$EXISTING_ISSUE" ]; then
            echo "==> Creating GitHub issue to alert maintainer..."
            cat > /tmp/issue-body.md <<EOF
          ### Summary

          Automated upstream compatibility validation failed for **Factory CLI v${UPSTREAM_VER}**.
          This may indicate an upstream layout change or a patcher regression.

          - **Workflow Run**: [Run #${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          - **Target Version**: \`${UPSTREAM_VER}\`
          - **Commit**: \`${GITHUB_SHA}\`

          ### Upstream References

          - **Official Changelog**: [Factory Release Notes](https://docs.factory.ai/changelog/release-notes)
          - **Factory CLI Docs**: [Droid CLI Reference](https://docs.factory.ai/droid-cli/cli-reference)
          - **Upstream Install Script**: \`https://app.factory.ai/cli\`
          - **Upstream Binary Base**: \`https://downloads.factory.ai/factory-cli/releases/\`

          ### Maintainer Alert
          cc @rNoz — Manual inspection required.
          EOF
            sed -i 's/^          //' /tmp/issue-body.md

            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Upstream Compatibility Validation Failure: Factory CLI v${UPSTREAM_VER}" \
              --label "upstream-breakage" \
              --body-file /tmp/issue-body.md
          else
            echo "==> Breakage issue #$EXISTING_ISSUE is already open."
            gh issue comment "$EXISTING_ISSUE" --repo "$GITHUB_REPOSITORY" \
              --body "cc @rNoz — Upstream compatibility validation failed again for Factory CLI v${UPSTREAM_VER}. [Workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          fi

  publish:
    name: publish
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && needs.build-and-test.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Verify release token is configured
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN repository secret is required for protected-branch release automation."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Download packaging metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: package-metadata-${{ needs.build-and-test.outputs.upstream_version }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Create release branch and pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          UPSTREAM_VER: ${{ needs.build-and-test.outputs.upstream_version }}
          PACKAGE_REVISION: ${{ needs.build-and-test.outputs.package_revision }}
        run: |
          python3 scripts/update-release-metadata.py "$UPSTREAM_VER" --set-pkgrel "$PACKAGE_REVISION"
          BRANCH="release/v${UPSTREAM_VER}"
          git switch -C "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO README.md tests/test_versions.py
          if git diff --cached --quiet; then
            echo "::notice::Release metadata is already current; no release PR is needed."
            exit 0
          fi
          git commit -m "chore(release): prepare v${UPSTREAM_VER}"
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          git push --force-with-lease origin "$BRANCH"
          PR_URL=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$BRANCH" --base main --json url --jq '.[0].url // empty')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "chore(release): prepare v${UPSTREAM_VER}" \
              --body "Automated release preparation for Factory CLI v${UPSTREAM_VER}. CI validation runs before auto-merge.")
          fi
          gh pr merge "$PR_URL" --auto --squash --delete-branch

  refresh-release-pr:
    name: refresh release pull request
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Verify release token is configured
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN repository secret is required for release-PR refresh automation."
            exit 1
          fi

      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Update open release branches before auto-merge
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base main \
            --json headRefName,url \
            --jq '.[] | select(.headRefName | startswith("release/v")) | [.headRefName, .url] | @tsv' |
          while IFS=$'\t' read -r BRANCH PR_URL; do
            [ -n "$BRANCH" ] || continue
            git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            OLD_SHA=$(git rev-parse "refs/remotes/origin/$BRANCH")
            git switch --detach "refs/remotes/origin/$BRANCH"
            git rebase origin/main
            git push \
              --force-with-lease="refs/heads/$BRANCH:$OLD_SHA" \
              origin "HEAD:refs/heads/$BRANCH"
            gh pr merge "$PR_URL" --auto --squash --delete-branch
          done
