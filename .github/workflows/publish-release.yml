name: Publish merged release

'on':
  pull_request:
    branches: [ main ]
    types: [ closed ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to republish'
        required: true
        type: string
      merge_sha:
        description: 'Merged commit SHA that owns the release tag'
        required: true
        type: string
      aur_only:
        description: 'Repair AUR metadata from current main without changing a GitHub release'
        required: false
        default: false
        type: boolean

concurrency:
  group: factory-cli-release-publication
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  publish:
    name: publish
    if: >
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.aur_only && 'main' || github.event_name == 'workflow_dispatch' && inputs.merge_sha || github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Verify AUR availability before announcing release
        if: inputs.aur_only != true
        env:
          AUR_PKG_NAME: ${{ vars.AUR_PKG_NAME || 'factory-ai-droid-cli-rnoz-bin' }}
        run: |
          python3 - "$AUR_PKG_NAME" <<'PY'
          import json
          import subprocess
          import sys

          package = sys.argv[1]
          result = subprocess.run(
              [
                  "curl",
                  "--fail",
                  "--silent",
                  "--show-error",
                  "--retry",
                  "3",
                  f"https://aur.archlinux.org/rpc/v5/info/{package}",
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          payload = json.loads(result.stdout)
          if payload.get("resultcount", 0) < 1:
              raise SystemExit(f"::error::AUR package {package} is not available")
          print(f"==> Verified AUR availability for {package}.")
          PY

      - name: Publish GitHub release
        if: inputs.aur_only != true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MERGE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.merge_sha || github.event.pull_request.merge_commit_sha }}
          HEAD_REF: ${{ github.event_name == 'workflow_dispatch' && format('release/v{0}', inputs.version) || github.event.pull_request.head.ref }}
        run: |
          UPSTREAM_VER=$(grep -oP '^pkgver=\K.*' PKGBUILD)
          PKGREL=$(grep -oP '^pkgrel=\K.*' PKGBUILD)
          PACKAGE_VERSION="${UPSTREAM_VER}-${PKGREL}"
          RELEASE_TAG="v${PACKAGE_VERSION}"
          EXPECTED_BRANCH="release/v${UPSTREAM_VER}"
          if [ "$HEAD_REF" != "$EXPECTED_BRANCH" ]; then
            echo "::error::Merged release branch does not match PKGBUILD version."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')
            if [ "$TAG_SHA" != "$MERGE_SHA" ]; then
              echo "::error::Existing release tag points to $TAG_SHA, expected $MERGE_SHA."
              exit 1
            fi
          fi

          # Heal .SRCINFO against the checked-out PKGBUILD so the release asset
          # always agrees on ${PACKAGE_VERSION}, even when repairing a merge
          # that predates revision-synchronized metadata. Self-contained so it
          # also works on historical checkouts whose script lacks update_srcinfo.
          python3 - "$UPSTREAM_VER" "$PKGREL" <<'PY'
          import re
          import sys
          from pathlib import Path

          version, pkgrel = sys.argv[1], int(sys.argv[2])
          text = Path(".SRCINFO").read_text()
          updated, found_pkgver = re.subn(
              r"^(\s*pkgver = ).*$", rf"\g<1>{version}", text, count=1, flags=re.MULTILINE
          )
          updated, found_pkgrel = re.subn(
              r"^(\s*pkgrel = ).*$", rf"\g<1>{pkgrel}", updated, count=1, flags=re.MULTILINE
          )
          if found_pkgver != 1 or found_pkgrel != 1:
              raise SystemExit("::error::.SRCINFO pkgver/pkgrel fields not found")
          Path(".SRCINFO").write_text(updated)
          PY

          python3 scripts/fetch-changelog.py "$UPSTREAM_VER" > /tmp/upstream-notes.md

          cat << 'EOF' > /tmp/release-notes.md
          __UPSTREAM_NOTES__

          ---

          ### Package details (rNoz tweaks)
          - **Zero-Waste Titling**: Neutralizes automatic background Claude Haiku 4.5 LLM titling calls on every prompt (optional).
          - **Keybinding Remap**: The default remap is editor `Ctrl-G`, model cycling `Ctrl-P`, and queued-message pull `Ctrl-I` (optional).
          - **Single Lean Binary**: Package contains only one binary compiled/chosen for the target CPU architecture.
          - **Automatic Release Sync**: Checks Factory releases every few hours and publishes verified updates.
          - **Platform Support**: Handles AVX2-optimized x86_64, non-AVX2 baseline x86_64, aarch64, and verified Apple Silicon macOS patching.
          - **Official Factory Changelog**: [Factory Release Notes](https://docs.factory.ai/changelog/release-notes) ([Raw Markdown](https://docs.factory.ai/changelog/release-notes.md))
          - **Clean Source Snapshot**: Distributes packaging scripts only (PKGBUILD, .SRCINFO, and patch sources). Upstream binaries are pulled directly from Factory servers by makepkg.

          ### Installation

          **Arch Linux (AUR):**
          ```bash
          yay -S factory-ai-droid-cli-rnoz-bin
          ```

          **macOS:**
          ```bash
          ./scripts/patch-macos.sh
          ```

          ### Build Notification
          @rNoz — Successfully built and smoke-tested in the Arch Linux container. AUR availability was verified before announcing this release; publication is attempted separately when configured.
          EOF
          sed -i 's/^          //' /tmp/release-notes.md
          sed -i "s/\${UPSTREAM_VER}/$UPSTREAM_VER/g" /tmp/release-notes.md
          sed -i "s/\${PACKAGE_VERSION}/$PACKAGE_VERSION/g" /tmp/release-notes.md
          python3 -c '
          with open("/tmp/upstream-notes.md", "r") as f:
              notes = f.read()
          with open("/tmp/release-notes.md", "r") as f:
              content = f.read()
          with open("/tmp/release-notes.md", "w") as f:
              f.write(content.replace("__UPSTREAM_NOTES__", notes))
          '

          tar -czf "factory-ai-droid-cli-rnoz-bin-${PACKAGE_VERSION}.src.tar.gz" \
            PKGBUILD .SRCINFO LICENSE patch_title.py patch_keybindings.py patches/patch_title.py patches/patch_keybindings.py factory-ai-droid-cli-rnoz-bin.install

          if ! gh release create "$RELEASE_TAG" "factory-ai-droid-cli-rnoz-bin-${PACKAGE_VERSION}.src.tar.gz" \
            --title "Factory CLI v${PACKAGE_VERSION} (rNoz tweaks)" \
            --notes-file /tmp/release-notes.md \
            --target "$MERGE_SHA"; then
            gh release edit "$RELEASE_TAG" --title "Factory CLI v${PACKAGE_VERSION} (rNoz tweaks)" --notes-file /tmp/release-notes.md
            gh release upload "$RELEASE_TAG" "factory-ai-droid-cli-rnoz-bin-${PACKAGE_VERSION}.src.tar.gz" --clobber
          fi

      - name: Publish to AUR (Optional)
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
          AUR_PKG_NAME: ${{ vars.AUR_PKG_NAME || 'factory-ai-droid-cli-rnoz-bin' }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "==> AUR_SSH_KEY secret is not set. Skipping AUR publish."
            exit 0
          fi

          UPSTREAM_VER=$(grep -oP '^pkgver=\K.*' PKGBUILD)
          PKGREL=$(grep -oP '^pkgrel=\K.*' PKGBUILD)
          PACKAGE_VERSION="${UPSTREAM_VER}-${PKGREL}"

          # Heal .SRCINFO against the checked-out PKGBUILD so AUR always
          # receives metadata that agrees on ${PACKAGE_VERSION}. Self-contained
          # so it also works on historical checkouts whose script lacks
          # update_srcinfo.
          python3 - "$UPSTREAM_VER" "$PKGREL" <<'PY'
          import re
          import sys
          from pathlib import Path

          version, pkgrel = sys.argv[1], int(sys.argv[2])
          text = Path(".SRCINFO").read_text()
          updated, found_pkgver = re.subn(
              r"^(\s*pkgver = ).*$", rf"\g<1>{version}", text, count=1, flags=re.MULTILINE
          )
          updated, found_pkgrel = re.subn(
              r"^(\s*pkgrel = ).*$", rf"\g<1>{pkgrel}", updated, count=1, flags=re.MULTILINE
          )
          if found_pkgver != 1 or found_pkgrel != 1:
              raise SystemExit("::error::.SRCINFO pkgver/pkgrel fields not found")
          Path(".SRCINFO").write_text(updated)
          PY

          # Never regress AUR below what current main ships: skip when the
          # checked-out package files differ from origin/main.
          git fetch origin main --quiet
          if ! git diff --quiet FETCH_HEAD HEAD -- PKGBUILD .SRCINFO LICENSE patches/patch_title.py patches/patch_keybindings.py factory-ai-droid-cli-rnoz-bin.install; then
            echo "::warning::Checked-out package files differ from current main; skipping AUR publish to avoid regressing AUR. Repair AUR from main with aur_only=true."
            exit 0
          fi

          mkdir -p ~/.ssh
          KEY_FILE="$(mktemp ~/.ssh/aur_key.XXXXXX)"
          trap 'rm -f "$KEY_FILE"' EXIT
          echo "$AUR_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          echo "aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN" >> ~/.ssh/known_hosts
          echo "aur.archlinux.org ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBLMiLrP8pVi5BFX2i3vepSUnpedeiewE5XptnUnau+ZoeUOPkpoCgZZuYfpaIQfhhJJI5qgnjJmr4hyJbe/zxow=" >> ~/.ssh/known_hosts

          export GIT_SSH_COMMAND="ssh -i $KEY_FILE -o StrictHostKeyChecking=yes"
          git clone "ssh://aur@aur.archlinux.org/${AUR_PKG_NAME}.git" /tmp/aur-repo
          git -C /tmp/aur-repo checkout -B master origin/master
          cp PKGBUILD .SRCINFO LICENSE patch_title.py patch_keybindings.py factory-ai-droid-cli-rnoz-bin.install /tmp/aur-repo/
          git -C /tmp/aur-repo rm --ignore-unmatch -f patch-droid.py
          git -C /tmp/aur-repo rm --ignore-unmatch -f patch-title.py
          git -C /tmp/aur-repo rm --ignore-unmatch -r -f patches
          cd /tmp/aur-repo
          git config user.name "$AUR_USERNAME"
          git config user.email "$AUR_EMAIL"
          git add PKGBUILD .SRCINFO LICENSE patch_title.py patch_keybindings.py factory-ai-droid-cli-rnoz-bin.install
          if git diff --cached --quiet; then
            echo "==> AUR metadata is already current."
          else
            git commit -m "Update to v${PACKAGE_VERSION}"
            git push origin master
          fi

      - name: Close resolved breakage issues
        if: inputs.aur_only != true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          UPSTREAM_VER=$(grep -oP '^pkgver=\K.*' PKGBUILD)
          PKGREL=$(grep -oP '^pkgrel=\K.*' PKGBUILD)
          PACKAGE_VERSION="${UPSTREAM_VER}-${PKGREL}"
          EXISTING_ISSUES=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "upstream-breakage" --state open --json number --jq '.[].number' || true)
          for issue_num in $EXISTING_ISSUES; do
            if [ -n "$issue_num" ]; then
              gh issue close "$issue_num" --repo "$GITHUB_REPOSITORY" --comment "Resolved automatically by successful release v${PACKAGE_VERSION}." || true
            fi
          done
